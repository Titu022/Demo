<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Wordle - 12k+ Possible Words</title>
    <style>
        :root {
            --correct: #6aaa64;
            --present: #c9b458;
            --absent: #3a3a3c;
            --border: #3a3a3c;
            --bg: #121213;
            --text: #ffffff;
        }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        header { border-bottom: 1px solid var(--border); width: 100%; text-align: center; padding: 10px 0; }
        #game-container { display: grid; grid-template-rows: repeat(6, 1fr); grid-gap: 5px; margin-top: 20px; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); grid-gap: 5px; }
        .tile { width: 55px; height: 55px; border: 2px solid var(--border); display: flex; justify-content: center; align-items: center; font-size: 1.8rem; font-weight: bold; text-transform: uppercase; transition: all 0.3s; }
        .tile.correct { background-color: var(--correct); border-color: var(--correct); }
        .tile.present { background-color: var(--present); border-color: var(--present); }
        .tile.absent { background-color: var(--absent); border-color: var(--absent); }
        #message { margin: 20px; font-weight: bold; height: 24px; color: #ff4b4b; }
        #keyboard { margin-top: auto; margin-bottom: 30px; width: 100%; max-width: 500px; padding: 0 10px; }
        .key-row { display: flex; justify-content: center; margin-bottom: 8px; }
        .key { background-color: #818384; color: white; border: 0; border-radius: 4px; padding: 15px 12px; margin: 2px; cursor: pointer; font-weight: bold; flex: 1; }
        .key.wide { flex: 1.5; }
    </style>
</head>
<body>

<header><h1>MEGA WORDLE</h1></header>
<div id="message"></div>
<div id="game-container"></div>

<div id="keyboard">
    <div class="key-row" id="row1"></div>
    <div class="key-row" id="row2"></div>
    <div class="key-row" id="row3"></div>
</div>

<script>
    // In a real 12k scenario, you'd fetch a .txt file. 
    // Here is a script to handle a massive array.
    let WORDS = ["CRANE", "STARE", "PLANT", "AUDIO", "HOUSE", "WORLD", "LIGHT", "SPACE", "GHOST", "PIXEL"]; 
    
    // FETCHING THE FULL LIST (Example of how to scale to 12,000+)
    // You can replace this URL with any raw text file containing 5-letter words
    async function loadWords() {
        try {
            const response = await fetch('https://raw.githubusercontent.com/charlesreid1/five-letter-words/master/sgb-words.txt');
            const text = await response.text();
            WORDS = text.split('\n').map(w => w.toUpperCase().trim()).filter(w => w.length === 5);
            console.log("Loaded " + WORDS.length + " words!");
            initGame();
        } catch (e) {
            console.log("Failed to load external list, using fallback.");
            initGame();
        }
    }

    let targetWord, currentAttempt = 0, currentGuess = "", gameOver = false;

    function initGame() {
        targetWord = WORDS[Math.floor(Math.random() * WORDS.length)];
        const container = document.getElementById('game-container');
        container.innerHTML = '';
        for (let i = 0; i < 6; i++) {
            const row = document.createElement('div');
            row.className = 'row';
            for (let j = 0; j < 5; j++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.id = `tile-${i}-${j}`;
                row.appendChild(tile);
            }
            container.appendChild(row);
        }
    }

    function handleInput(key) {
        if (gameOver) return;
        if (key === 'DEL' || key === 'BACKSPACE') {
            currentGuess = currentGuess.slice(0, -1);
        } else if (key === 'ENTER') {
            if (currentGuess.length === 5) {
                if (WORDS.includes(currentGuess)) submitGuess();
                else showMessage("Not in word list!");
            } else {
                showMessage("Too short!");
            }
        } else if (currentGuess.length < 5 && /^[A-Z]$/.test(key)) {
            currentGuess += key;
        }
        updateGrid();
    }

    function updateGrid() {
        for (let j = 0; j < 5; j++) {
            const tile = document.getElementById(`tile-${currentAttempt}-${j}`);
            tile.textContent = currentGuess[j] || "";
            tile.style.borderColor = currentGuess[j] ? "#565758" : "#3a3a3c";
        }
    }

    function submitGuess() {
        let checkTarget = targetWord;
        const result = Array(5).fill('absent');
        const rowTiles = Array.from({length: 5}, (_, i) => document.getElementById(`tile-${currentAttempt}-${i}`));

        for (let i = 0; i < 5; i++) {
            if (currentGuess[i] === targetWord[i]) {
                result[i] = 'correct';
                checkTarget = checkTarget.replace(currentGuess[i], '_');
            }
        }
        for (let i = 0; i < 5; i++) {
            if (result[i] !== 'correct' && checkTarget.includes(currentGuess[i])) {
                result[i] = 'present';
                checkTarget = checkTarget.replace(currentGuess[i], '_');
            }
        }

        result.forEach((status, i) => {
            setTimeout(() => rowTiles[i].classList.add(status), i * 150);
        });

        if (currentGuess === targetWord) {
            setTimeout(() => showMessage("GENIUS!"), 800);
            gameOver = true;
        } else if (currentAttempt === 5) {
            setTimeout(() => showMessage(`LOST! Word was ${targetWord}`), 800);
            gameOver = true;
        } else {
            currentAttempt++;
            currentGuess = "";
        }
    }

    function showMessage(msg) {
        const m = document.getElementById('message');
        m.textContent = msg;
        setTimeout(() => m.textContent = "", 2000);
    }

    // Keyboards
    const layout = [["Q","W","E","R","T","Y","U","I","O","P"],["A","S","D","F","G","H","J","K","L"],["ENTER","Z","X","C","V","B","N","M","DEL"]];
    layout.forEach((row, i) => {
        const rowEl = document.getElementById(`row${i+1}`);
        row.forEach(key => {
            const btn = document.createElement('button');
            btn.textContent = key;
            btn.className = `key ${key.length > 1 ? 'wide' : ''}`;
            btn.onclick = () => handleInput(key);
            rowEl.appendChild(btn);
        });
    });

    document.addEventListener('keydown', (e) => handleInput(e.key.toUpperCase()));
    
    loadWords(); // This starts the game
</script>
</body>
</html>
